services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment: &app_env
      RUN_MIGRATIONS: "1"
      DATABASE_URL: sqlite:////data/app.db
      STORAGE_DIR: /data/storage
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_DEV_SECRET_please_set_a_long_random_value}
      OWNER_EMAILS: ${OWNER_EMAILS:-owner@example.com}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://localhost:5173}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_STUDIO: ${STRIPE_PRICE_STUDIO:-}
      DEPTH_BACKEND: ${DEPTH_BACKEND:-heuristic}
      POSE_BACKEND: ${POSE_BACKEND:-auto}
      MAX_WORKERS: ${MAX_WORKERS:-2}
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - app_data:/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "worker"]
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      <<: *app_env
      RUN_MIGRATIONS: "0"
    volumes:
      - app_data:/data

volumes:
  app_data:
  redis_data:
